x-backend-runtime: &backend-runtime
  image: ${COMPOSE_PROJECT_NAME:-hackagen-production}-backend:production
  build:
    context: ./src
    dockerfile: backend/Dockerfile
  env_file: !override
    - ${PRODUCTION_ENV_FILE:-./.env}
  environment: &backend-environment
    ENVIRONMENT: production
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL psycopg URL}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must not be empty}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must not be empty}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must not be empty}
    OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    EMAIL_DEV_FALLBACK: ${EMAIL_DEV_FALLBACK:-false}
    JOB_QUEUE_PROVIDER: celery
    PROCESSING_EXECUTION_MODE: distributed
    INLINE_PROCESSING_RECOVERY_ENABLED: "false"
    REDIS_URL: redis://redis:6379/0
    CHROMA_MODE: http
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    CHROMA_SSL: "false"
    UPLOAD_DIR: /app/backend/uploads
    OUTPUT_DIR: /app/backend/outputs
    EMBEDDING_CACHE_DIR: /app/backend/cache/chunk_embeddings
  entrypoint: &production-entrypoint
    - sh
    - -ec
    - |
      fail() { echo "Refusing unsafe production/load-test startup: $$1" >&2; exit 1; }
      case "$${ENVIRONMENT:-}" in production|loadtest) ;; *) fail "ENVIRONMENT must be production or loadtest" ;; esac
      [ -n "$${POSTGRES_PASSWORD:-}" ] || fail "POSTGRES_PASSWORD must not be empty"
      [ -n "$${JWT_SECRET:-}" ] || fail "JWT_SECRET must not be empty"
      [ "$${JWT_SECRET}" != "CHANGE_THIS_DEV_SECRET" ] || fail "JWT_SECRET still uses CHANGE_THIS_DEV_SECRET"
      case "$${EMAIL_DEV_FALLBACK:-false}" in true|True|TRUE|1|yes|Yes|YES|on|On|ON) fail "EMAIL_DEV_FALLBACK must be false" ;; esac
      if [ "$${ENVIRONMENT}" = "production" ]; then
        [ "$${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}" = "https://openrouter.ai/api/v1" ] || fail "production requires the official OpenRouter base URL"
      fi
      [ "$${JOB_QUEUE_PROVIDER:-}" = "celery" ] || fail "JOB_QUEUE_PROVIDER must be celery"
      case "$${DATABASE_URL:-}" in postgresql://*|postgresql+psycopg://*) ;; *) fail "DATABASE_URL must use PostgreSQL" ;; esac
      [ "$${CHROMA_MODE:-}" = "http" ] || fail "CHROMA_MODE must be http"
      exec "$$@"
    - --
  volumes: !override
    - production-uploads:/app/backend/uploads
    - production-outputs:/app/backend/outputs
    - production-cache:/app/backend/cache
  depends_on: &backend-dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    chroma:
      condition: service_healthy
  networks:
    - hackagen-network
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackagen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must not be empty}
      POSTGRES_DB: ${POSTGRES_DB:-hackagen}
    volumes:
      - production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hackagen-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - hackagen-network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - production-chroma:/data
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - hackagen-network
    restart: unless-stopped

  backend:
    <<: *backend-runtime
    container_name: !reset null
    command: ["sh", "-c", "uv run --project . alembic upgrade head && uv run --project . uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker-ingestion:
    <<: *backend-runtime
    command: ["uv", "run", "--project", ".", "celery", "-A", "app.jobs.celery_app:celery_app", "worker", "-Q", "ingestion", "-c", "2", "--loglevel=INFO"]
    healthcheck: &worker-healthcheck
      test: ["CMD-SHELL", "uv run --project . celery -A app.jobs.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  worker-generation:
    <<: *backend-runtime
    command: ["uv", "run", "--project", ".", "celery", "-A", "app.jobs.celery_app:celery_app", "worker", "-Q", "generation", "-c", "4", "--loglevel=INFO"]
    healthcheck: *worker-healthcheck

  worker-video:
    <<: *backend-runtime
    command: ["uv", "run", "--project", ".", "celery", "-A", "app.jobs.celery_app:celery_app", "worker", "-Q", "video", "-c", "1", "--loglevel=INFO"]
    healthcheck: *worker-healthcheck

  frontend:
    container_name: !reset null
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hackagen-network

networks:
  hackagen-network:
    name: ${COMPOSE_PROJECT_NAME:-hackagen-production}-network

volumes:
  production-postgres:
  production-redis:
  production-chroma:
  production-uploads:
  production-outputs:
  production-cache:
